name: Deploy landing page
on:
  push:
    branches: [main]
    paths: ['website/**', 'dashboard.html', 'browser-prototype/**', '.github/workflows/landing-page.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check walkthrough
        run: |
          node website/app.test.cjs
          node website/landing-motion.test.cjs
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p /tmp/deepintel-public
          cp website/index.html website/style.css website/app.js website/landing-motion.js /tmp/deepintel-public/
          cp -R website/assets /tmp/deepintel-public/assets
          cp dashboard.html /tmp/deepintel-public/dashboard.html
          mkdir -p /tmp/deepintel-public/browser-prototype/runtime
          cp browser-prototype/engine.js browser-prototype/features.js browser-prototype/metadata.json browser-prototype/engine-data.json browser-prototype/model.onnx /tmp/deepintel-public/browser-prototype/
          cp browser-prototype/runtime/ort.wasm.min.js browser-prototype/runtime/ort-wasm-simd-threaded.mjs browser-prototype/runtime/ort-wasm-simd-threaded.wasm /tmp/deepintel-public/browser-prototype/runtime/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/deepintel-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
